[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "documind"
version = "1.0.0"
description = "DocuMind - Scalable Document Processing & Question Extraction Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "pymupdf>=1.24.0",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0.80",
    "pytesseract>=0.3.10",
    "reportlab>=4.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
